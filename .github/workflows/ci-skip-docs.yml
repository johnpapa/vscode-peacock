name: CI

# Companion to ci.yml. The `main` branch ruleset requires a status check
# named "build" on every PR, but ci.yml's own `build` job uses
# `paths-ignore` and never runs on PRs that only touch docs/markdown --
# which otherwise leaves that required check permanently unreported and
# the PR permanently blocked from merging. This workflow triggers on
# exactly the inverse path set and immediately reports a passing "build"
# check (same job id, so it satisfies the same required status check) so
# docs-only PRs stay mergeable.
on:
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - 'images/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docs/markdown-only change - skipping the full CI build."
